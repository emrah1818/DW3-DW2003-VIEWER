name: Test and build DW3 / DW2003 Viewer
# Tests without game data, the converter, and the Windows x64 package (smoke-tested on the runner).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to publish after a successful build (e.g. v0.1.0); empty = build only'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python tools/build_native.py
      - run: python -m pytest -q
      - run: node --check www/app.js && node --check www/view3d.js
  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - run: python -m pip install -r requirements.txt "pyinstaller>=6.12,<7"
      - run: python tools/build_native.py
      - run: python -m PyInstaller --noconfirm --clean DW3_DW2003_Viewer.spec
      - name: Converter runs on its own (static C++ runtime)
        shell: pwsh
        run: |
          $out = & dist\DW3_DW2003_Viewer\_internal\native\bin\dw3_converter.exe 2>&1
          Write-Output $out
          if ($LASTEXITCODE -ne 2 -or -not ("$out" -match 'Usage')) { exit 1 }
          dumpbin /dependents dist\DW3_DW2003_Viewer\_internal\native\bin\dw3_converter.exe
      - name: Smoke test (window, WebGL, local server)
        shell: pwsh
        run: |
          # default start (automatic = Direct3D 11) must draw the generated test model; the other backends are
          # tried too and reported (the runner has no OpenGL driver, so 'gl' may fail there)
          $p = Start-Process -FilePath dist\DW3_DW2003_Viewer\DW3_DW2003_Viewer.exe -ArgumentList '--smoke-test=smoke.json' -PassThru -Wait
          Get-Content smoke.json
          $code = $p.ExitCode
          foreach ($b in 'd3d11', 'gl', 'd3d11on12', 'swiftshader') {
            $q = Start-Process -FilePath dist\DW3_DW2003_Viewer\DW3_DW2003_Viewer.exe -ArgumentList "--smoke-test=smoke_$b.json", "--angle=$b" -PassThru -Wait
            Write-Host "== $b exit $($q.ExitCode)"; if (Test-Path "smoke_$b.json") { Get-Content "smoke_$b.json" }
            Get-Content "$env:LOCALAPPDATA\DW3-DW2003-Viewer\logs\viewer.log" -ErrorAction SilentlyContinue | Select-Object -Last 15
          }
          Get-ChildItem "$env:LOCALAPPDATA\DW3-DW2003-Viewer\logs" -ErrorAction SilentlyContinue
          if ($code -ne 0) { exit 1 }
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, ANLEITUNG.md, ARCHITECTURE.md, DEVELOPMENT_LOG.md, RESEARCH.md dist\DW3_DW2003_Viewer\
          Compress-Archive -Path dist\DW3_DW2003_Viewer -DestinationPath DW3_DW2003_Viewer_Windows_x64.zip
          (Get-FileHash DW3_DW2003_Viewer_Windows_x64.zip -Algorithm SHA256).Hash.ToLower() + '  DW3_DW2003_Viewer_Windows_x64.zip' | Out-File -Encoding ascii SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DW3_DW2003_Viewer_Windows_x64
          path: |
            DW3_DW2003_Viewer_Windows_x64.zip
            SHA256SUMS.txt
            smoke.json
            smoke_*.json
  release:
    # publishes the tested Windows package as a GitHub release (never replaces an existing one): a pushed tag v*,
    # or a manual run with the input "release"
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DW3_DW2003_Viewer_Windows_x64
          path: assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.release }}"
          [ -n "$tag" ] || tag="${GITHUB_REF_NAME}"
          case "$tag" in v[0-9]*) ;; *) echo "bad tag $tag"; exit 1;; esac
          notes="docs/release_notes/${tag}.md"
          test -f "$notes"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "Release $tag exists, not replaced"; exit 1; fi
          mv assets/smoke.json assets/windows-smoke.json
          gh release create "$tag" assets/DW3_DW2003_Viewer_Windows_x64.zip assets/SHA256SUMS.txt assets/windows-smoke.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "DW3 / DW2003 Viewer ${tag#v}" --notes-file "$notes" --latest
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,assets -q '.tagName, (.assets[].name)'
